<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações — Raven</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="raven.css">
</head>
<body>

  <nav class="nav-bar">
    <button class="nav-btn" onclick="window.location.href='raven.html'" title="Voltar">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>

    <div class="nav-url">
      <svg class="nav-lock" viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <input type="text" spellcheck="false" value="raven://configurações" readonly
        style="color: var(--muted); cursor: default;"/>
    </div>

    <div class="profile-badge" id="badge">Normal</div>
  </nav>

  <div class="config-wrap">
    <div class="config-body">

      <span class="config-title">Configurações</span>

      <div class="config-section">
        <span class="config-section-label">Motor de busca</span>
        <select class="config-select" id="motor-select" onchange="salvarMotor()">
          <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
          <option value="https://google.com/search?q=">Google</option>
          <option value="https://search.brave.com/search?q=">Brave</option>
          <option value="https://bing.com/search?q=">Bing</option>
        </select>
      </div>

     
      <div class="config-section">
        <span class="config-section-label">Atalhos</span>
        <div class="atalho-form">
          <input class="atalho-input" id="atalho-nome" type="text" placeholder="Nome" />
          <input class="atalho-input" id="atalho-url"  type="text" placeholder="URL" />
          <button class="btn-add" onclick="adicionarAtalho()">+</button>
        </div>
        <div class="atalhos-lista" id="atalhos-lista"></div>
      </div>

    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const perfil = params.get('perfil') || 'normal';
    const badge = document.getElementById('badge');
    const nomes = { normal: 'Normal', vpn: 'VPN', amnesia: 'Amnesia' };
    badge.textContent = nomes[perfil] || 'Normal';


    function salvarMotor() {
      localStorage.setItem('raven_motor', document.getElementById('motor-select').value);
    }

    function carregarMotor() {
      const motor = localStorage.getItem('raven_motor');
      if (motor) document.getElementById('motor-select').value = motor;
    }

    function getAtalhos() {
      return JSON.parse(localStorage.getItem('raven_atalhos') || '[]');
    }

    function salvarAtalhos(atalhos) {
      localStorage.setItem('raven_atalhos', JSON.stringify(atalhos));
    }

    function adicionarAtalho() {
      const nome = document.getElementById('atalho-nome').value.trim();
      const url  = document.getElementById('atalho-url').value.trim();
      if (!nome || !url) return;

      const atalhos = getAtalhos();
      atalhos.push({ nome, url: url.startsWith('http') ? url : 'https://' + url });
      salvarAtalhos(atalhos);

      document.getElementById('atalho-nome').value = '';
      document.getElementById('atalho-url').value  = '';
      renderizarAtalhos();
    }

    function removerAtalho(index) {
      const atalhos = getAtalhos();
      atalhos.splice(index, 1);
      salvarAtalhos(atalhos);
      renderizarAtalhos();
    }

    function renderizarAtalhos() {
      const lista = document.getElementById('atalhos-lista');
      const atalhos = getAtalhos();
      if (atalhos.length === 0) {
        lista.innerHTML = '<p class="empty-msg">Nenhum atalho adicionado</p>';
        return;
      }
      lista.innerHTML = atalhos.map((a, i) => `
        <div class="atalho-item">
          <span class="atalho-item-nome">${a.nome}</span>
          <span class="atalho-item-url">${a.url}</span>
          <button class="btn-remover" onclick="removerAtalho(${i})">×</button>
        </div>
      `).join('');
    }

    document.getElementById('atalho-url').addEventListener('keydown', e => {
      if (e.key === 'Enter') adicionarAtalho();
    });

    carregarMotor();
    renderizarAtalhos();
  </script>
</body>
</html>
